name: Build Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
          version: "latest"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Add pip install -r requirements.txt if there was another dependencies

      - name: Build with PyInstaller
        run: |
          pyinstaller main.py --onefile --add-data "lib;lib" -n SAS4Tool

      - name: Compress with UPX
        run: |
          upx dist/SAS4Tool.exe --lzma --best --force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS4Tool-Executable
          path: dist/SAS4Tool.exe
